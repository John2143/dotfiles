name: Fleet patch

# Weekly fleet patch from the org's self-hosted runners, replacing the masked
# office timer. No long-lived credential is stored anywhere: the job mints a
# GitHub OIDC token, exchanges it at OpenBao's jwt-github mount for a 10-minute
# token, reads the fleet SSH key and shreds it when the run ends.

on:
  schedule:
    - cron: "0 9 * * 0"          # Sundays 09:00 UTC = 04:00 America/New_York
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated hosts (ring order kept; office is the canary)"
        type: string
        default: ""
      dry_run:
        description: "Bump, evaluate and probe only — no push, switch or notify"
        type: boolean
        default: false
      bump:
        description: "Bump nixpkgs/nixpkgs-stable/oh-my-pi before switching"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: fleet-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: [self-hosted, nixos]
    timeout-minutes: 500
    env:
      BAO_ADDR: https://openbao.ts.2143.me
      BAO_ROLE: ci-fleet-patch
      SECRET_PATH: consumers/data/john2143-com/default/fleet-patch
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to OpenBao with GitHub OIDC
        id: bao
        run: |
          set -euo pipefail
          JQ="nix run nixpkgs#jq --"
          jwt=$(curl -sfS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                  "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${BAO_ADDR}" | $JQ -r .value)
          token=$(curl -sfS -X POST \
                  -d "{\"role\":\"${BAO_ROLE}\",\"jwt\":\"${jwt}\"}" \
                  "${BAO_ADDR}/v1/auth/jwt-github/login" | $JQ -r .auth.client_token)
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Read the fleet key
        run: |
          set -euo pipefail
          JQ="nix run nixpkgs#jq --"
          umask 077
          curl -sfS -H "X-Vault-Token: ${{ steps.bao.outputs.token }}" \
               "${BAO_ADDR}/v1/${SECRET_PATH}" > "$RUNNER_TEMP/secret.json"
          $JQ -r '.data.data.ssh_private' "$RUNNER_TEMP/secret.json" > "$RUNNER_TEMP/fleet-key"
          $JQ -r '.data.data.ntfy_file'   "$RUNNER_TEMP/secret.json" > "$RUNNER_TEMP/ntfy.env"
          chmod 600 "$RUNNER_TEMP/fleet-key" "$RUNNER_TEMP/ntfy.env"
          rm -f "$RUNNER_TEMP/secret.json"
          case "$(head -1 "$RUNNER_TEMP/fleet-key")" in
            *"BEGIN OPENSSH PRIVATE KEY"*) ;;
            *) echo "::error::OpenBao returned no usable key at ${SECRET_PATH}"; exit 1;;
          esac

      - name: Run fleet patch
        env:
          # The bump commit is made by `git commit` inside the script; the runner
          # has no git identity, so supply one (the frigate workflow does the same).
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          BUMP: ${{ inputs.bump == false && '0' || '1' }}
          ONLY: ${{ inputs.only }}
          HOST_TIMEOUT: "1200"
          FLEET_STATE: ${{ runner.temp }}/state
          FLEET_CLONE: ${{ github.workspace }}
          FLEET_SSH_IDENTITY: ${{ runner.temp }}/fleet-key
          FLEET_KNOWN_HOSTS: ${{ github.workspace }}/scripts/fleet-known_hosts
          FLEET_NTFY_FILE: ${{ runner.temp }}/ntfy.env
          FLEET_OFFICE_ADDR: office
          FLEET_SKIP_EXTERNAL: "1"
          FLEET_STAGE_HOSTS: github
        # The runner service's PATH is a curated list with no ssh, and the job needs
        # it for every host; nix shell puts openssh in front for this one command.
        run: nix shell nixpkgs#openssh -c bash scripts/fleet-patch.sh

      - name: Report
        if: always()
        run: |
          set -uo pipefail
          state="${RUNNER_TEMP}/state"
          if [ -f "$state/last-run.md" ]; then
            cat "$state/last-run.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          # A push made with GITHUB_TOKEN does not trigger other workflows, so the
          # image build that a flake.lock push used to start is dispatched by hand.
          case "$(git log -1 --format=%s)" in
            *"weekly input bump"*)
              curl -sfS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/John2143/dotfiles/actions/workflows/build-frigate-genai.yml/dispatches \
                -d '{"ref":"master"}';;
          esac
          curl -s -o /dev/null -X POST -H "X-Vault-Token: ${{ steps.bao.outputs.token }}" \
            "${BAO_ADDR}/v1/auth/token/revoke-self"
          rm -f "$RUNNER_TEMP/fleet-key" "$RUNNER_TEMP/ntfy.env"
          git remote set-url origin https://github.com/John2143/dotfiles.git

      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-patch-report
          path: |
            ${{ runner.temp }}/state/last-run.md
            ${{ runner.temp }}/state/run.log
          if-no-files-found: warn
