name: Bump oh-my-pi

# Moves the `oh-my-pi` input to the latest `john` tip (john only advances after
# John2143/oh-my-pi's fork-sync gate passes, daily 05:17 UTC). Builds omp the way
# office/arch evaluate it (the input follows this flake's nixpkgs), pushes it to
# attic, and only then commits flake.lock — so a host rebuild after the bump
# substitutes omp instead of compiling it. Commits pushed with GITHUB_TOKEN do
# not trigger other workflows (build-frigate-genai.yml watches flake.lock).

on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-omp
  cancel-in-progress: false

jobs:
  bump:
    runs-on: [self-hosted, nixos]
    timeout-minutes: 240
    env:
      NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Update and commit the oh-my-pi input
        id: update
        shell: bash
        run: |
          set -euo pipefail
          nix flake update oh-my-pi
          if git diff --quiet -- flake.lock; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "oh-my-pi already current; nothing to build."
            exit 0
          fi
          rev=$(nix eval --raw --impure --expr '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.oh-my-pi.locked.rev')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(omp): bump oh-my-pi to ${rev:0:10}" -- flake.lock
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      - name: Build omp as office/arch evaluate it
        if: steps.update.outputs.changed == 'yes'
        run: nix build --impure --out-link result-omp --expr '(builtins.getFlake (toString ./.)).inputs.oh-my-pi.packages.x86_64-linux.omp'

      - name: Push omp to attic
        if: steps.update.outputs.changed == 'yes'
        run: XDG_CONFIG_HOME=/etc attic push 2143nix ./result-omp

      - name: Push the bump to master
        if: steps.update.outputs.changed == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:master || { git pull --rebase origin master && git push origin HEAD:master; }
