[general]
live_config_reload = true
# Colours come from theme-switch (~/.local/state/theme/current/alacritty.toml).
# Alacritty applies imports first and this file last, so no colour table may be
# repeated here.
import = [
  "~/.local/state/theme/current/alacritty.toml"
]

[font]
size = 14

  [font.normal]
  family = "JetBrainsMono"

  [font.offset]
  x = 0
  y = -3

[window.padding]
x = 5
y = 5
