# hyprlock has no `source` directive, so this file is a template: theme-switch
# renders it with the Catppuccin palette (nixos/modules/theme.nix) and the
# hyprlock-theme wrapper passes the result with --config.
general {
    ignore_empty_input = true # an empty submit is not a failed PAM attempt
}

animations {
    enabled = false # less to go wrong on resume/output changes
}

background {
    color = rgba(@base@ff)

    noise = 0.1
    blur_size = 5
}

input-field {
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.10 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(@mauve@)
    inner_color = rgb(@surface0@)
    font_color = rgb(@text@)
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(@peach@)
    fail_color = rgb(@red@) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below

    position = 0, -20
    halign = center
    valign = center
}
